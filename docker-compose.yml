
services:
  strapi:
    build: .
    image: strapi:latest
    container_name: strapi
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "8080:1337"
    depends_on:
      - postgres
    volumes:
      - ./public:/app/public
    networks:
      - strapi-network

  postgres:
    image: postgres:14
    container_name: postgres
    restart: unless-stopped
    env_file: .env.docker
    environment:
      - POSTGRES_DB=strapi_investment
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - strapi-network

volumes:
  postgres_data:
    name: strapi-postgres-data

networks:
  strapi-network:
    driver: bridge